<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grilling board</title>
<style>
  /* Colors are T3 Code theme variables, so the board follows light and dark. */
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 var(--font-sans); color: var(--foreground); }
  h2, h3, p, figure, pre { margin: 0; }
  .board { display: grid; gap: 14px; }

  /* Heard and the map: one lane per row, a label then chips. */
  .lanes { display: grid; gap: 8px; }
  .lane { display: grid; grid-template-columns: 82px 1fr; gap: 10px; align-items: start; }
  .lane > b { padding-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
  .lane > div { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 10px; border: 1px solid var(--border); border-radius: 12px; font-size: 12.5px; }
  .chip em { font-style: normal; color: var(--muted-foreground); }
  .heard .chip { border-color: color-mix(in oklab, var(--success) 45%, var(--border)); background: color-mix(in oklab, var(--success) 9%, transparent); }
  .heard .chip.guess { border-style: dashed; border-color: var(--warning); background: color-mix(in oklab, var(--warning) 12%, transparent); }
  .now .chip { border-color: var(--primary); font-weight: 600; }
  .waiting .chip { border-style: dashed; color: var(--muted-foreground); }

  /* A card: title, scene, question, options. */
  .card { display: grid; gap: 14px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--card-foreground); }
  .card > header { display: flex; align-items: center; gap: 10px; }
  .num { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); font-weight: 700; }
  .card h2 { font-size: 16px; font-weight: 650; }
  .scene { display: grid; gap: 10px; padding: 14px; border-radius: 10px; background: color-mix(in oklab, var(--foreground) 5%, transparent); }
  figcaption { font-size: 12.5px; color: var(--muted-foreground); }
  .ask { font-size: 19px; font-weight: 650; line-height: 1.3; }

  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .option { display: grid; gap: 10px; align-content: start; padding: 12px; border: 1px solid var(--border); border-radius: 10px; }
  .option > header { display: flex; align-items: baseline; gap: 7px; }
  .option > header::before { content: "say"; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
  .option h3 { font-size: 17px; font-weight: 700; }
  .option .price { font-size: 12.5px; color: var(--muted-foreground); }
  .option .price b { color: var(--foreground); font-weight: 600; }
  .option.pick { border: 1.5px solid var(--primary); background: color-mix(in oklab, var(--primary) 8%, transparent); }
  .option.pick > header::after { content: "my pick"; margin-left: auto; padding: 1px 8px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); font-size: 11px; font-weight: 600; }
  .option.yours > header::after { content: "your plan"; margin-left: auto; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted-foreground); font-size: 11px; font-weight: 600; }
  .options.stack { grid-template-columns: 1fr; }
  .hint { font-size: 12px; color: var(--muted-foreground); text-align: center; }

  /* Drawing pieces. A flow is a row of nodes joined by arrows. .flow.down stacks it. */
  .flow { display: flex; align-items: stretch; gap: 6px; }
  .node { flex: 1 1 0; min-width: 0; display: grid; align-content: center; gap: 2px; padding: 7px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--background); color: var(--foreground); font-size: 12.5px; text-align: center; overflow-wrap: break-word; }
  .node small { min-width: 0; font: 10.5px var(--font-mono); color: var(--muted-foreground); overflow-wrap: anywhere; }
  .to { flex: none; align-self: center; color: var(--muted-foreground); line-height: 1; }
  .to::before { content: "\2192"; }
  .flow.down { flex-direction: column; }
  .flow.down .to::before { content: "\2193"; }
  .option .flow { gap: 3px; }
  .option .node { padding: 6px 3px; }
  .hot { border: 1.5px dashed var(--warning); background: color-mix(in oklab, var(--warning) 14%, var(--background)); }
  .new { border-color: var(--success); background: color-mix(in oklab, var(--success) 12%, var(--background)); }
  .bad { border-color: var(--destructive); background: color-mix(in oklab, var(--destructive) 12%, var(--background)); }
  .gone { opacity: .55; text-decoration: line-through; }

  /* Code as it stands, or as a diff with .add and .del lines. */
  .code { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--code-background); font: 12px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .code .add, .code .del { display: block; margin: 0 -12px; padding: 0 12px; }
  .code .add { background: color-mix(in oklab, var(--success) 18%, transparent); }
  .code .del { background: color-mix(in oklab, var(--destructive) 16%, transparent); text-decoration: line-through; }
  .code .dim { color: var(--muted-foreground); }

  @media (max-width: 520px) {
    .lane { grid-template-columns: 1fr; gap: 4px; }
    .lane > b { padding-top: 0; }
    .scene .flow { flex-direction: column; }
    .scene .to::before { content: "\2193"; }
  }
</style>
<body>
