<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- stacked skill cards -->
  <rect x="60" y="80" width="112" height="136" rx="16" fill="none" stroke="#a78bfa" stroke-width="8" opacity="0.45"/>
  <rect x="82" y="58" width="112" height="136" rx="16" fill="#1e1b4b" stroke="url(#card)" stroke-width="8"/>
  <!-- bolt -->
  <path d="M148 72 L106 136 H134 L120 182 L166 114 H138 Z" fill="url(#bolt)" filter="url(#glow)" stroke-linejoin="round"/>
  <!-- sparkles -->
  <path d="M206 54 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#fde047"/>
  <circle cx="206" cy="206" r="6" fill="#22d3ee"/>
</svg>
